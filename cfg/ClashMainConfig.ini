; 最后由自建优先的故障转移处理。
ruleset=🚀 故障转移,[]FINAL

; 共用出口策略；独立规则保留匹配和优先级。
; Google/AI 使用洛杉矶同一个 66Cloud 出口，两条入口可切换；常用途经 US 优选。
; 66Cloud TCP 备线仍不加入 R6S 自动组；44M/20M 两台只在测速工具中手选。
; 本地节点名称按入口、出口及用途显示。筛选兼容旧订阅名称，迁移与回滚时保留原组成员。
; Netflix 先保新加坡（自建→机场），再自动切美国、日本。连通性不等于播放或字幕。
