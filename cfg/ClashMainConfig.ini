;ClashMainConfig
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/astralwaveorg
;项目地址：https://github.com/astralwaveorg/OpenClashConfig
;模板地址01：https://cdn.jsdelivr.net/gh/astralwaveorg/OpenClashConfig@refs/heads/main/cfg/ClashMainConfig.ini
;模板地址02：https://raw.githubusercontent.com/astralwaveorg/OpenClashConfig/refs/heads/main/cfg/ClashMainConfig.ini
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88

;本模板为 Full 模板，可以自由添加规则和分组，无性能考量，较为臃肿

;兼容 max_allowed_rulesets=64 的订阅转换后端，ruleset 条目总数须不超过 64

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;本地地址和域名直连
;订阅转换域名固定经日本自建节点
ruleset=🇯🇵 JP自建测速,[]DOMAIN,subapi.dnscli.top
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 故障转移,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 故障转移,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800
;各大游戏平台下载域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
;Zoom 视频会议优先走代理，代理均不可用时回退直连
ruleset=📹 Zoom,[]GEOSITE,zoom
ruleset=📞 Talkatone,[]GEOSITE,talkatone
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🎧 Discord,[]GEOSITE,discord
;其余即时通讯域名由通用分组处理，专用规则须位于此分类之前
ruleset=💬 即时通讯,[]GEOSITE,category-communication
ruleset=🤖 Grok,[]GEOSITE,xai
;社交媒体包括了 Twitter(X)/Facebook/Instagram 等海外主流社交媒体
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=💾 OneDrive,[]GEOSITE,onedrive
ruleset=🤖 Copilot,[]GEOSITE,bing
ruleset=🤖 Claude,[]GEOSITE,anthropic
;谷歌全家桶（含 YouTube/Gemini/FCM/Android/Firebase/Golang 等 18 个子类别），置于国外AI服务之前确保 Gemini 优先命中
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🤖 国外AI服务,[]GEOSITE,category-ai-!cn
;国内 AI 服务默认直连，可按需切换代理；须位于 cn 兜底规则之前
ruleset=🤖 国内AI服务,[]GEOSITE,category-ai-cn
ruleset=📦 容器服务,[]GEOSITE,docker
ruleset=📦 容器服务,[]GEOSITE,category-container
ruleset=🚀 GitHub,[]GEOSITE,github
;其余开发者服务包括 GitLab、软件仓库和开发工具等相关域名
ruleset=💻 开发者服务,[]GEOSITE,category-dev
;学术资源包括 Google Scholar、IEEE、ACM 和主要学术出版平台等相关域名
ruleset=📚 学术资源,[]GEOSITE,category-scholar-!cn
;测速工具包括 SpeedTest 等主流测速工具域名
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=🎥 AppleTV+,[]GEOSITE,apple-tvplus
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=🇸🇬 新加坡媒体,[]GEOSITE,netflix
ruleset=🇸🇬 新加坡媒体,[]GEOSITE,disney
ruleset=🇸🇬 新加坡媒体,[]GEOSITE,hbo
ruleset=🇸🇬 新加坡媒体,[]GEOSITE,primevideo
ruleset=🇸🇬 新加坡媒体,[]GEOSITE,dazn
ruleset=🇸🇬 新加坡媒体,[]GEOSITE,viu
;Emby 包括主流 Emby 服务相关域名
ruleset=🎥 Emby,[]GEOSITE,category-emby
ruleset=🎻 Spotify,[]GEOSITE,spotify
ruleset=📺 Bahamut,[]GEOSITE,bahamut
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=📰 新闻资讯,[]GEOSITE,category-media
ruleset=🌎 国外媒体,[]GEOSITE,category-entertainment
;第三方 PT 域名集
ruleset=⏬ PT站点,clash-domain:https://raw.githubusercontent.com/FUJIWARESHINE/pt-domains/refs/heads/main/pt-domains.mrs,28800
ruleset=💳 PayPal,[]GEOSITE,paypal
ruleset=🛒 国外电商,[]GEOSITE,category-ecommerce
ruleset=🪙 加密货币,[]GEOSITE,category-cryptocurrency
ruleset=🚀 故障转移,[]GEOSITE,gfw
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,twitter,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,facebook,no-resolve
ruleset=🇬 谷歌服务,[]GEOIP,google,no-resolve
;已识别的境外域名走代理，专用业务规则仍优先
ruleset=🌍 国外域名,[]GEOSITE,geolocation-!cn
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geosite:cn 作为国内域名兜底
ruleset=🎯 全球直连,[]GEOSITE,cn
;补充已核验的国内服务主机；境外和业务分组规则优先
ruleset=🎯 全球直连,https://raw.githubusercontent.com/astralwaveorg/OpenClashConfig/main/custom/rule/CN_Verified_Direct.list,28800
;允许解析未分类域名，以中国大陆 IP 作为最后一层直连判断
ruleset=🎯 全球直连,[]GEOIP,cn
;以上兜底规则会根据实际情况随时取消
;PT/BT 优化开启会使 80/443 以外端口的流量直连
ruleset=🔀 非标端口,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
;尚未识别的域名走代理兜底；国内漏项按实测添加精确直连规则
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位结束

;设置节点分组标志位
